<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./src/assets/fav.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anurag-Singh</title>
  </head>
  <body>
    <style>
      .loader {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        width: 100%;
      }
      .loader img {
        max-width: 80%;
        height: auto;
        animation: pulse 2s infinite;
      }
      @keyframes pulse {
        0% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(1.05);
          opacity: 0.8;
        }
        100% {
          transform: scale(1);
          opacity: 1;
        }
      }
      @media (max-width: 600px) {
        .loader img {
          max-width: 95%;
        }
      }
    </style>
    <div class="loader" id="loader-wrapper">
      <img src="./src/assets/fav.png" alt="Loading..." />
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      window.addEventListener("load", function () {
        var loader = document.getElementById("loader-wrapper");
        setTimeout(function () {
          loader.style.display = "none";
        }, 5000);
      });
    </script>
  </body>
</html>
